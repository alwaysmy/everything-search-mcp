[package]
name = "everything-search-mcp"
version = "0.3.11-dev.1"
edition = "2021"
description = "Everything file search MCP server for Windows - zero Python, no es.exe subprocess"
license = "MIT"
repository = "https://github.com/alwaysmy/everything-search-mcp"
readme = "README.md"

[[bin]]
name = "everything-search-mcp"
path = "src/main.rs"

# Shared implementation. The bin above is the standalone stdio MCP server; the
# cdylib is the Everything 1.5 plugin, which Everything.exe loads into its own
# process and which serves MCP from there (same tool layer, same HTTP backend).
# See src/lib.rs and src/plugin/mod.rs.
[lib]
name = "everything_mcp_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

