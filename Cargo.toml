[package]
name = "everything-search-mcp"
version = "0.3.11-dev.1"
edition = "2021"
description = "Everything file search MCP server for Windows - zero Python, no es.exe subprocess"
license = "MIT"
repository = "https://github.com/alwaysmy/everything-search-mcp"
readme = "README.md"


# The Everything 1.5 plugin. Everything.exe loads this DLL into its own process,
# where it serves the five tools over loopback HTTP. This branch (v3) ships no
# executable: the stdio server and its CLI live on the v2 branch.
[lib]
name = "everything_mcp_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

