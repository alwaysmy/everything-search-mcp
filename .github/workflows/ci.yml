name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Needed by the Format step below; not part of every toolchain profile.
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Formatting is a separate, cheap failure: a rustfmt diff in a pull request
      # is noise the author can fix in one command, and catching it here keeps it
      # out of the review. The tree was not rustfmt-clean before this step was
      # added, so the commit that enabled it also formatted every file once.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --locked
      # v3 ships no executable; the thing a release installs is the plugin DLL.
      # The endpoint itself is covered by tests/plugin_http.rs, which drives it
      # over a loopback socket without needing Everything.
      - name: Plugin artefact
        shell: pwsh
        run: |
          $dll = "target\release\everything_mcp_core.dll"
          if (-not (Test-Path $dll)) { throw "plugin DLL was not built" }
          Write-Host ("plugin DLL: {0:N0} bytes" -f (Get-Item $dll).Length)
          if (Test-Path "target\release\everything-search-mcp.exe") {
            throw "an executable was produced on the v3 branch"
          }
