name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Needed by the Format step below; not part of every toolchain profile.
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Formatting is a separate, cheap failure: a rustfmt diff in a pull request
      # is noise the author can fix in one command, and catching it here keeps it
      # out of the review. The tree was not rustfmt-clean before this step was
      # added, so the commit that enabled it also formatted every file once.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --locked

      # The unit tests cover query compilation and rendering. This covers the
      # binary the way a client meets it: spawn it, speak MCP on stdin, ask for
      # the tool list. No Everything instance is needed for any of it.
      - name: MCP smoke test
        shell: pwsh
        run: |
          $exe = "target\release\everything-search-mcp.exe"
          $initialize = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          $payload = (@($initialize, $list) -join "`n") + "`n"
          $stdout = $payload | & $exe 2>$null | Out-String

          $reply = ($stdout -split "`n") | Where-Object { $_ -match '"id":2' } | Select-Object -First 1
          if (-not $reply) { throw "no tools/list reply; raw: $stdout" }
          $tools = ($reply | ConvertFrom-Json).result.tools
          if ($tools.Count -ne 5) { throw "expected 5 tools, got $($tools.Count)" }
          $search = $tools | Where-Object { $_.name -eq 'everything_search' }
          if (-not $search.inputSchema.properties.exclude_noise) { throw "input schema lost exclude_noise" }
          if (-not $search.inputSchema.properties.format) { throw "input schema lost format" }
          if (-not $search.outputSchema.properties.noise_filter) { throw "output schema lost noise_filter" }
          Write-Host "MCP smoke test passed"
