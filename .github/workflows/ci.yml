name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --locked

      # The unit tests cover the query and classification paths. These cover the
      # binary the way a user meets it. No Everything instance is needed: the
      # argument parser and the config writers are what break silently.
      - name: CLI smoke test
        shell: pwsh
        run: |
          # GitHub's pwsh wrapper sets $ErrorActionPreference = 'Stop', and since
          # PowerShell 7.4 a native command exiting non-zero then becomes a
          # *terminating* error. This script deliberately provokes a non-zero exit
          # to check the code, so that behaviour has to be off.
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = "target\release\everything-search-mcp.exe"

          $v = & $exe --version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "bad --version output: $v" }

          $cfg = & $exe config --target json --no-check --json | ConvertFrom-Json
          if ($cfg.targets[0].snippet -notmatch 'mcpServers') { throw "config emitted no mcpServers block" }
          if ($cfg.write -ne $false) { throw "config claimed to write something" }

          foreach ($t in 'dsh', 'claude', 'codex', 'vscode', 'opencode') {
            $doc = & $exe config --target $t --no-check --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "config --target $t failed" }
            if (-not $doc.targets[0].snippet) { throw "config --target $t produced no snippet" }
            if ($doc.targets[0].snippet -notmatch 'everything-search-mcp\.exe') {
              throw "config --target $t names the wrong executable"
            }
          }

          & $exe config --target definitely-not-a-target 2>$null
          if ($LASTEXITCODE -ne 2) { throw "unknown target should exit 2, got $LASTEXITCODE" }

          & $exe search "*.md" --max 1 --json 2>$null | Out-Null
          if ($LASTEXITCODE -notin 0, 1) {
            # 0 when Everything is reachable, 1 when it is not. Anything else is a bug.
            throw "search exited $LASTEXITCODE"
          }

          Write-Host "CLI smoke test passed"
          # GitHub's pwsh wrapper ends the step with `exit $LASTEXITCODE`, and the
          # last native command here is the search probe above - which legitimately
          # exits 1 on a runner with no Everything installed. Without this the step
          # reports failure after passing every check.
          exit 0
