[package]
name = "everything-search-mcp"
version = "0.3.5"
edition = "2021"
description = "Everything file search MCP server for Windows - zero Python, no es.exe subprocess"
license = "MIT"
repository = "https://github.com/alwaysmy/everything-search-mcp"
readme = "README.md"

[[bin]]
name = "everything-search-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
